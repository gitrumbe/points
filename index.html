<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Points Tracker</title>
<meta name="theme-color" content="#F2F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F121A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: a game-like daily board. Stats up top, a week strip, routines as big tap targets, and a side rail with today's points, the saving goal and the team jar. Each girl has her own accent colour. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#E9EDF5; --line:#D8DEEA;
  --ink:#1A2132; --ink-2:#525C75; --ink-3:#8790A5;
  --gold:#F0AE14; --gold-deep:#B97F00; --gold-soft:#FFF0C7; --gold-ink:#3D2A00;
  --good:#1E9A60; --good-soft:#DBF2E6; --wait:#C46F12; --wait-soft:#FCEAD3;
  --ayla:#D23F76; --ayla-soft:#FBE0EA; --lani:#2A9150; --lani-soft:#DCF1E2; --parent:#3D55D0; --parent-soft:#E1E6FA;
  --accent:var(--parent); --accent-soft:var(--parent-soft); --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(20,28,50,.06), 0 6px 18px rgba(20,28,50,.06);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --r-lg:22px; --r-md:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F121A; --surface:#181C28; --surface-2:#232A3A; --line:#2F3749;
  --ink:#EDF0F7; --ink-2:#A8B0C3; --ink-3:#737C92;
  --gold:#F6C244; --gold-deep:#C99520; --gold-soft:#372C10; --gold-ink:#2A1D00;
  --good:#4CCB8C; --good-soft:#143326; --wait:#F2A54C; --wait-soft:#3A2914;
  --ayla:#F2709F; --ayla-soft:#3E1C2A; --lani:#5CCB7F; --lani-soft:#173322; --parent:#8597FF; --parent-soft:#212849;
  --on-accent:#0F121A; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F121A; --surface:#181C28; --surface-2:#232A3A; --line:#2F3749;
  --ink:#EDF0F7; --ink-2:#A8B0C3; --ink-3:#737C92;
  --gold:#F6C244; --gold-deep:#C99520; --gold-soft:#372C10; --gold-ink:#2A1D00;
  --good:#4CCB8C; --good-soft:#143326; --wait:#F2A54C; --wait-soft:#3A2914;
  --ayla:#F2709F; --ayla-soft:#3E1C2A; --lani:#5CCB7F; --lani-soft:#173322; --parent:#8597FF; --parent-soft:#212849;
  --on-accent:#0F121A; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
[data-who="ayla"]{--accent:var(--ayla);--accent-soft:var(--ayla-soft)}
[data-who="lani"]{--accent:var(--lani);--accent-soft:var(--lani-soft)}
[data-who="parent"]{--accent:var(--parent);--accent-soft:var(--parent-soft)}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.app{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 64px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.hint{display:block;font-size:13px;color:var(--ink-2)}
.num{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px}
.brand{display:flex;align-items:center;gap:10px;font:800 21px var(--f-display)}
.pv{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pvs{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:4px;gap:2px}
.pvb{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2)}
.pvb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dot{width:10px;height:10px;border-radius:50%}
.dot-ayla{background:var(--ayla)} .dot-lani{background:var(--lani)} .dot-parent{background:var(--parent)}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:9px 14px}
.link{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px;font-weight:500}

/* coin */
.coin{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#7A5200;background:radial-gradient(circle at 34% 30%,#FFE69A,#F3B21C 58%,#C88A06);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 2px 6px rgba(200,138,6,.35)}
.coin.sm{width:30px;height:30px;font-size:16px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end}
.eyebrow{font-size:14px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.hello h1{font-size:clamp(38px,6vw,56px);font-weight:800}
.nm{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:12px}
.stat{flex:1 1 150px;background:var(--surface);border-radius:var(--r-lg);padding:14px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.stat.money{flex-direction:row;align-items:center;gap:14px;background:var(--gold-soft)}
.stat.money .num{font-size:44px;color:var(--ink)}
.stat.money .lbl{color:var(--ink-2);display:block;margin-top:4px}
.stat.money > div{min-width:0}
.stat .num.sm{font-size:30px}
.stat small{font-size:16px;font-weight:600;color:var(--ink-3)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:calc(var(--p)*100%);background:var(--accent);border-radius:inherit;transition:width .4s ease}
.bar.gold i{background:var(--gold)}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;border-radius:16px;background:var(--surface);border:2px solid transparent;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.wd:disabled{cursor:default;opacity:.45;box-shadow:none;background:transparent}
.wd[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.wdn{font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.wdd{font:800 22px var(--f-display);line-height:1.1}
.mk{height:16px;display:grid;place-items:center;font-size:15px;line-height:1}
.mk.full::before{content:"★";color:var(--gold)}
.mk.part::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.mk.wait::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wait)}
.mk.none::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.is-today .wdn{color:var(--accent)}

/* tabs */
.tabs{display:inline-flex;align-self:flex-start;background:var(--surface-2);border-radius:99px;padding:4px;gap:2px}
.tab{border:0;background:transparent;border-radius:99px;padding:9px 18px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
.routines{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:22px;font-weight:700}

/* routine card */
.r-head{display:flex;align-items:center;gap:12px}
.r-icon{flex:none;width:48px;height:48px;border-radius:15px;background:var(--accent-soft);display:grid;place-items:center;font-size:25px}
.r-title{flex:1;min-width:0}
.r-title h3{font-size:23px;font-weight:700}
.r-note{font-size:13px;color:var(--ink-2)}
.ring{--p:0;--c:var(--accent);flex:none;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*360deg),var(--surface-2) 0);display:grid;place-items:center}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 14px var(--f-display);font-variant-numeric:tabular-nums;line-height:1}
.ring small{font:600 9px var(--f-body);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.routine.checked .ring{--c:var(--good)}
.routine.done .ring{--c:var(--wait)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;align-self:flex-start;white-space:nowrap}
.chip.todo{background:var(--surface-2);color:var(--ink-2)}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.gold{background:var(--gold-soft);color:var(--ink)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 12px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:16px;font-weight:500;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.task:hover:not(:disabled){border-color:var(--accent)}
.task:disabled{cursor:default}
.box{flex:none;width:30px;height:30px;border-radius:10px;border:2.5px solid var(--ink-3);display:grid;place-items:center;color:var(--on-accent)}
.box svg{opacity:0}
.task[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent}
.task[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.task[aria-pressed="true"] .box svg{opacity:1}
.task[aria-pressed="true"] .tl{color:var(--ink-2)}
.emo{font-size:21px;flex:none;width:26px;text-align:center}
.tl{min-width:0}
.routine.checked .task[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}

@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes bounce{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--wait)}100%{box-shadow:0 0 0 16px transparent}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1)}}
.task.pop .box{animation:pop .3s ease-out}
.routine.celebrate{animation:glow 1.1s ease-out}
.routine.celebrate .chip{animation:bounce .55s ease-out}
.r-icon{position:relative}
.spark{position:absolute;left:50%;top:50%;font-size:16px;color:var(--gold);pointer-events:none;animation:burst .9s ease-out forwards;opacity:0}

/* points card */
.pl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pl li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.pl li:first-child{border-top:0}
.pl .pv-l{min-width:0}
.pl .pv-l b{font-weight:500}
.pl .pts{font:800 18px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pl .earned .pts{color:var(--good)}
.pl .waiting .pts{color:var(--wait)}
.pl .todo{color:var(--ink-3)}
.pl .todo .pts{color:var(--ink-3)}
.tag{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.totals{display:flex;gap:10px;flex-wrap:wrap}
.totals > div{flex:1 1 110px;background:var(--surface-2);border-radius:14px;padding:10px 12px}
.totals .num{font-size:26px}

/* goal + jar */
.goal-top{display:flex;align-items:center;gap:12px}
.big-emo{flex:none;width:56px;height:56px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;font-size:30px}
.goal-top h3{font-size:21px;font-weight:700}
.jar-wrap{display:flex;align-items:center;gap:16px}
.jar{width:96px;flex:none;height:auto}
.jar-lid{fill:var(--ink-3)} .jar-neck{fill:var(--line)} .jar-bg{fill:var(--surface-2)}
.jar-fill{fill:var(--gold)} .jar-coin{fill:var(--gold-deep);opacity:.35}
.jar-glass{fill:none;stroke:var(--ink-3);stroke-width:3}
.jar-shine{fill:none;stroke:var(--surface);stroke-width:5;stroke-linecap:round;opacity:.55}

/* shop */
.shop-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.shop-head h2{font-size:30px;font-weight:800}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.reward{gap:12px}
.reward.saving{outline:3px solid var(--accent);outline-offset:-3px}
.rw-top{display:flex;align-items:center;gap:12px}
.rw-top h3{font-size:19px;font-weight:700;line-height:1.15}
.rw-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 15px;border-radius:13px;font-weight:600;font-size:14px;border:2px solid transparent;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);color:var(--on-accent)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}

/* parent */
.girls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.gp-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 22px var(--f-display)}
.gp-head h2{font-size:26px;font-weight:800}
.gp-stats{display:flex;gap:6px;flex-wrap:wrap}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line)}
.crow .r-icon{width:40px;height:40px;font-size:20px;border-radius:12px}
.ct{flex:1 1 150px;min-width:0}
.ct b{font-weight:600}
.miss{display:block;font-size:12.5px;color:var(--wait);margin-top:2px}
.ca{display:flex;gap:8px 10px;align-items:center;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.opt.col{flex-direction:column;align-items:stretch}
.opt b{font-weight:600}
.sw{flex:none;position:relative;width:52px;height:30px;border-radius:99px;background:var(--surface-2);border:2px solid var(--line);cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-3);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--on-accent)}
.seg{display:flex;gap:8px}
.seg button{width:44px;height:44px;border-radius:13px;border:2px solid var(--line);background:var(--surface);font:800 18px var(--f-display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.in{width:100%;min-height:42px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;font:400 14px var(--f-body)}
.in:focus{outline:none;border-color:var(--accent)}
.give{display:flex;gap:8px;align-items:stretch}
.give .in{flex:1;min-width:0}
.day-total{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.day-total .num{font-size:28px}
.reqs{display:flex;flex-direction:column;gap:10px}
.req{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--gold-soft);border-radius:var(--r-lg);padding:14px 16px}
.req .big-emo{background:var(--surface)}
.req-t{flex:1 1 200px;min-width:0}
.req-a{display:flex;gap:8px}
.rest{align-items:center;text-align:center;padding:36px 18px}
.rest .big-emo{width:72px;height:72px;font-size:38px}

/* new device setup */
[data-who="setup"]{--accent:var(--parent);--accent-soft:var(--parent-soft)}
.dot-setup{background:var(--ink-3)}
.setup{max-width:560px;width:100%;margin:12px auto 0;align-items:center;text-align:center;gap:18px;padding:30px 22px}
.setup h1{font-size:clamp(32px,6vw,44px);font-weight:800}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:28px;height:6px;border-radius:99px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.pk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border-radius:var(--r-lg);border:2px solid var(--line);background:var(--surface);cursor:pointer;font:700 19px var(--f-display)}
.pk:hover{border-color:var(--accent)}
.pk .av{width:64px;height:64px;font-size:30px}
.pins{display:flex;gap:14px;justify-content:center}
.pins i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink-3)}
.pins i.on{background:var(--accent);border-color:var(--accent)}
.pins.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{height:72px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font:800 28px var(--f-display);cursor:pointer;color:var(--ink)}
.pad button:hover:not(:disabled){border-color:var(--accent)}
.pad button:active:not(:disabled){background:var(--accent-soft)}
.pad button:disabled{opacity:.35;cursor:default}
.pad .ghostkey{border-color:transparent;font-size:22px}
.err{color:var(--wait);font-weight:600;min-height:1.4em}
.setup .in{text-align:center;font-size:17px;max-width:320px}
.lockcard{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:var(--r-md);padding:12px 16px;font-size:14px;color:var(--ink-2)}
/* devices */
.dev{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.dev:first-child{border-top:0}
.dev .av{width:38px;height:38px;font-size:17px}
.dev-t{flex:1 1 160px;min-width:0}
.dev-t b{font-weight:600}
.dev-a{display:flex;gap:8px;align-items:center}

/* right now focus */
.section-lbl{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.section-lbl .lbl{color:var(--accent)}
.routine.focus{border:3px solid var(--accent);box-shadow:var(--shadow),0 0 0 6px var(--accent-soft)}
.start{display:flex;flex-direction:column;gap:10px;padding:6px 0 2px}
.btn.big{min-height:58px;font-size:18px;border-radius:16px;font-family:var(--f-display);font-weight:800}
.rest-list{display:flex;flex-direction:column;gap:10px;margin-top:18px}

<body>
<div class="app" id="app" data-who="setup"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
/**
 * Points Tracker core logic.
 * The SAME code runs in the dashboard page and in the Apps Script, so points are
 * always worked out the same way. No page or Sheet code in here.
 */
var PointsCore = (function () {
  var ROUTINES = [
    { k: 'before', name: 'Before school', icon: '🌅', rule: 'before' },
    { k: 'after',  name: 'After school',  icon: '🏫', rule: 'after' },
    { k: 'night',  name: 'Night',         icon: '🌙', rule: 'night' },
    { k: 'chores', name: 'Weekly chores', icon: '🏠', rule: 'chores' }
  ];
  var MEM_ROUT = ['before', 'after', 'night'];
  var MEM_LEVELS = [1, 5, 10, 20, 40];
  var SELF_LEVELS = [5, 10, 20, 40, 80];
  var STREAK_LEVELS = [5, 10, 20, 40, 60];
  var GIRLS = ['ayla', 'lani'];
  var GIRL_NAMES = { ayla: 'Ayla', lani: 'Lani' };
  // Reasons a parent can take a point away (the girls see these words).
  var DED_REASONS = ['Lying', 'Rude or disrespectful', 'Ignoring a warning', 'Not following instructions', 'Asked for help before trying'];

  /* ---------- dates (all as 'yyyy-mm-dd' text) ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function toD(s) { return new Date(s + 'T12:00:00Z'); }
  function fmt(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function add(s, n) { var d = toD(s); d.setUTCDate(d.getUTCDate() + n); return fmt(d); }
  function dow(s) { return toD(s).getUTCDay(); }
  function isWk(s) { var w = dow(s); return w >= 1 && w <= 5; }
  function weekStart(s) { return add(s, -((dow(s) + 6) % 7)); }
  // A task can be left off some weekdays (Tasks tab: "Make tomorrow's lunch [not Fri]").
  // cfg.skip[routine][task index] = weekday numbers (0 = Sunday) when it isn't needed. It counts as done on those days.
  function skipped(cfg, k, i, s) { var r = cfg.skip && cfg.skip[k] && cfg.skip[k][i]; return !!(r && s && r.indexOf(dow(s)) >= 0); }
  function fillSkips(cfg, d, s) { if (!cfg.skip || !d || !d.t) return d; Object.keys(d.t).forEach(function (k) { d.t[k].forEach(function (_, i) { if (skipped(cfg, k, i, s)) d.t[k][i] = true; }); }); return d; }

  function blankDay(cfg) {
    var t = {};
    ROUTINES.forEach(function (r) { t[r.k] = (cfg.tasks[r.k] || []).map(function () { return false; }); });
    return { t: t, chk: {}, nc: false, behs: [], deds: [], started: {}, mem: {}, memDone: {}, memOk: {}, peeked: {}, practiceDone: {} };
  }
  // Make a stored day match the current task lists (tasks can be edited in the Sheet).
  function normalizeDay(cfg, d) {
    var b = blankDay(cfg);
    d = d || {};
    ['chk', 'started', 'mem', 'memDone', 'memOk', 'peeked', 'practiceDone'].forEach(function (key) { b[key] = d[key] || {}; });
    b.nc = !!d.nc;
    b.behs = d.behs || [];
    b.deds = d.deds || [];
    ROUTINES.forEach(function (r) {
      var src = (d.t && d.t[r.k]) || [];
      b.t[r.k] = b.t[r.k].map(function (_, i) { return !!src[i]; });
    });
    return b;
  }

  /**
   * Build the calculator for one snapshot of data.
   * cfg:  { rules, tasks, shop, startDate }
   * data: { days:{ayla:{date:day}, lani:{...}}, spending:[], requests:[], notes:[], goal:{} }
   */
  function make(cfg, data, today) {
    var R = cfg.rules;
    var pts = { before: R.before, after: R.after, night: R.night, chores: R.chores };
    GIRLS.forEach(function (g) { Object.keys((data.days && data.days[g]) || {}).forEach(function (s) { fillSkips(cfg, data.days[g][s], s); }); });
    function inRange(s) { return s >= cfg.startDate && s <= today; }
    function pk(g, s) { return data.days[g] && data.days[g][s]; }
    function day(g, s) {
      if (!data.days[g]) data.days[g] = {};
      if (!data.days[g][s]) data.days[g][s] = fillSkips(cfg, blankDay(cfg), s);
      return data.days[g][s];
    }
    function allDone(d, k) { return d.t[k].length > 0 && d.t[k].every(Boolean); }
    function finished(g, host, k) { var d = pk(g, host); return !!d && (!!d.chk[k] || allDone(d, k)); }
    function full(g, s) { var d = pk(g, s); return !!d && isWk(s) && !!d.chk.before && !!d.chk.after && !!d.chk.night; }
    function streakTo(g, s) {
      var n = 0, cur = s;
      for (var i = 0; i < 800 && cur >= cfg.startDate; i++) {
        if (isWk(cur)) { if (full(g, cur)) n++; else break; }
        cur = add(cur, -1);
      }
      return n;
    }
    function streakBonus(g, s) { return full(g, s) && streakTo(g, s) % R.streakDays === 0 ? R.streakBonus : 0; }
    function memOk(g, s, k) { var d = pk(g, s); return !!d && !!d.chk[k] && !!d.memOk[k]; }
    function dailyMaster(g, s) { return isWk(s) && MEM_ROUT.every(function (k) { return memOk(g, s, k); }); }
    function weeklyMaster(g, fri) {
      for (var i = 0; i < 5; i++) { var s = add(weekStart(fri), i); if (s < cfg.startDate || !dailyMaster(g, s)) return false; }
      return true;
    }
    function dayPts(g, s) {
      var d = pk(g, s); if (!d || s < cfg.startDate) return 0;
      var p = 0;
      if (isWk(s)) {
        ['before', 'after', 'night'].forEach(function (k) { if (d.chk[k]) p += pts[k]; });
        if (full(g, s) && d.nc) p += R.bonus;
        p += streakBonus(g, s);
      }
      if (d.chk.chores) p += pts.chores;
      if (dow(s) === 5 && weeklyMaster(g, s)) p += R.weeklyMaster;
      return p + d.behs.length;
    }
    function daysOf(g) { return Object.keys(data.days[g] || {}).filter(inRange); }
    function earned(g) { return daysOf(g).reduce(function (a, s) { return a + dayPts(g, s); }, 0); }
    function spent(g) { return data.spending.filter(function (x) { return x.g === g && x.date >= cfg.startDate; }).reduce(function (a, x) { return a + x.cost; }, 0); }
    // Points taken away only come off the points to spend (not the team jar, week, streaks or badges).
    function lostOn(g, s) { var d = pk(g, s); if (!d || s < cfg.startDate) return 0; return d.deds.filter(function (x) { return !x.fixed; }).length; }
    function lost(g) { return daysOf(g).reduce(function (a, s) { return a + lostOn(g, s); }, 0); }
    function balance(g) { return earned(g) - spent(g) - lost(g); }
    function weekDates(s) { var ws = weekStart(s), out = []; for (var i = 0; i < 7; i++) out.push(add(ws, i)); return out; }
    function weekPts(g) { return weekDates(today).reduce(function (a, s) { return a + (s <= today ? dayPts(g, s) : 0); }, 0); }
    function monthPts(g) { return daysOf(g).filter(function (s) { return s.slice(0, 7) === today.slice(0, 7); }).reduce(function (a, s) { return a + dayPts(g, s); }, 0); }
    function curStreak(g) {
      if (full(g, today)) return streakTo(g, today);
      var s = add(today, -1); while (!isWk(s)) s = add(s, -1);
      return s < cfg.startDate ? 0 : streakTo(g, s);
    }
    function bestStreak(g) { return daysOf(g).filter(isWk).reduce(function (m, s) { return Math.max(m, streakTo(g, s)); }, 0); }
    function noChaseCount(g) { return daysOf(g).filter(function (s) { return full(g, s) && pk(g, s).nc; }).length; }
    function memCount(g, k) { return daysOf(g).filter(function (s) { return memOk(g, s, k); }).length; }
    function dailyMasterCount(g) { return daysOf(g).filter(function (s) { return dailyMaster(g, s); }).length; }
    function weeklyMasterCount(g) { return daysOf(g).filter(function (s) { return dow(s) === 5 && weeklyMaster(g, s); }).length; }
    function routinesFor(s) {
      var w = dow(s), out = [];
      if (isWk(s)) ROUTINES.slice(0, 3).forEach(function (r) { out.push({ r: r, host: s }); });
      if (w === 5) out.push({ r: ROUTINES[3], host: s });
      if (w === 6) out.push({ r: ROUTINES[3], host: add(s, -1) }); // Saturday-morning chores count for Friday
      return out;
    }
    function nightLocked(g, s) { return isWk(s) && !finished(g, s, 'after'); }
    function isMemRun(d, k) { return !!d.memDone[k]; }
    function waitingOn(g, s) {
      return routinesFor(s).filter(function (x) { var d = pk(g, x.host); return d && allDone(d, x.r.k) && !d.chk[x.r.k]; });
    }
    function checkAllList(g, s) {
      return routinesFor(s).filter(function (x) { var d = pk(g, x.host); return d && allDone(d, x.r.k) && !d.chk[x.r.k] && !isMemRun(d, x.r.k); });
    }
    return {
      pts: pts, R: R, today: today, pk: pk, day: day, allDone: allDone, finished: finished, full: full,
      streakTo: streakTo, streakBonus: streakBonus, memOk: memOk, dailyMaster: dailyMaster, weeklyMaster: weeklyMaster,
      dayPts: dayPts, earned: earned, spent: spent, balance: balance, lostOn: lostOn, lost: lost, weekDates: weekDates, weekPts: weekPts, monthPts: monthPts,
      curStreak: curStreak, bestStreak: bestStreak, noChaseCount: noChaseCount, memCount: memCount,
      dailyMasterCount: dailyMasterCount, weeklyMasterCount: weeklyMasterCount, routinesFor: routinesFor,
      nightLocked: nightLocked, isMemRun: isMemRun, waitingOn: waitingOn, checkAllList: checkAllList
    };
  }

  /**
   * Apply one action to the data. Used for the instant update on the page and,
   * with the same rules, by the script before saving to the Sheet.
   * me: { who:'ayla'|'lani'|'parent', name:'Ayla'|'Hyrum'|... }
   * Returns { ok, error, touched:[ 'g|date' ], changed:{spending,requests,notes,goal} }.
   */
  function apply(cfg, data, today, me, op) {
    var C = make(cfg, data, today);
    var res = { ok: true, error: '', touched: [], changed: {} };
    var parent = me.who === 'parent';
    function fail(msg) { res.ok = false; res.error = msg; return res; }
    function touch(g, s) { var key = g + '|' + s; if (res.touched.indexOf(key) < 0) res.touched.push(key); }
    function validDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && s <= today; }
    function routineSlot(g, r, host, forGirl) {
      if (!r || !cfg.tasks[r]) return null;
      if (forGirl) {
        var ok = C.routinesFor(today).some(function (x) { return x.r.k === r && x.host === host; });
        return ok ? C.day(g, host) : null;
      }
      return validDate(host) ? C.day(g, host) : null;
    }
    var g = parent ? op.g : me.who;
    if (GIRLS.indexOf(g) < 0 && ['approve', 'decline', 'load'].indexOf(op.op) < 0) return fail('Unknown person');
    var girlOps = ['tick', 'start', 'startmem', 'peek', 'hide', 'memdone', 'practicedone', 'goal', 'cashin', 'noteSeen'];
    var parentOps = ['check', 'checkmem', 'uncheck', 'checkall', 'nochase', 'give', 'unbeh', 'take', 'fixded', 'unded', 'approve', 'decline', 'note'];
    if (girlOps.indexOf(op.op) >= 0 && parent) return fail('That is for the girls’ pages');
    if (parentOps.indexOf(op.op) >= 0 && !parent) return fail('Only a parent can do that');
    var d, r = op.r, k;
    switch (op.op) {
      case 'load': return res;
      case 'tick': {
        d = routineSlot(g, r, op.host, true); if (!d) return fail('Only today can be ticked');
        if (d.chk[r]) return fail('Already checked by a parent');
        if (r === 'night' && C.nightLocked(g, op.host)) return fail('Finish After school first');
        if (d.mem[r] === 'on' || d.mem[r] === 'practice') return fail('The list is hidden in memory mode');
        var i = Number(op.i); if (!(i >= 0 && i < d.t[r].length)) return fail('Unknown task');
        if (skipped(cfg, r, i, op.host)) return fail('That one isn\u2019t needed today');
        d.t[r][i] = !!op.on; d.started[r] = true; touch(g, op.host); return res;
      }
      case 'start': {
        d = routineSlot(g, r, op.host, true); if (!d) return fail('Only today can be started');
        d.started[r] = true; touch(g, op.host); return res;
      }
      case 'startmem': {
        d = routineSlot(g, r, op.host, true); if (!d) return fail('Only today can be started');
        if (MEM_ROUT.indexOf(r) < 0) return fail('Memory mode is for the daily routines');
        if (r === 'night' && C.nightLocked(g, op.host)) return fail('Finish After school first');
        if (d.t[r].some(function (v, j) { return v && !skipped(cfg, r, j, op.host); }) || d.chk[r]) return fail('Memory mode has to be switched on before you start');
        d.mem[r] = 'on'; d.started[r] = true; touch(g, op.host); return res;
      }
      case 'peek': {
        d = routineSlot(g, r, op.host, true); if (!d) return fail('Only today');
        if (d.mem[r] !== 'on' && d.mem[r] !== 'practice') return fail('Not in memory mode');
        d.mem[r] = 'peeked'; d.peeked[r] = true; touch(g, op.host); return res;
      }
      case 'hide': {
        d = routineSlot(g, r, op.host, true); if (!d) return fail('Only today');
        if (d.mem[r] !== 'peeked') return fail('Nothing to hide');
        d.mem[r] = 'practice'; touch(g, op.host); return res;
      }
      case 'memdone':
      case 'practicedone': {
        d = routineSlot(g, r, op.host, true); if (!d) return fail('Only today');
        var want = op.op === 'memdone' ? 'on' : 'practice';
        if (d.mem[r] !== want) return fail('Not in memory mode');
        if (r === 'night' && C.nightLocked(g, op.host)) return fail('Finish After school first');
        d.t[r] = d.t[r].map(function () { return true; });
        if (op.op === 'memdone') d.memDone[r] = true; else d.practiceDone[r] = true;
        touch(g, op.host); return res;
      }
      case 'goal': {
        if (op.reward && !cfg.shop.some(function (x) { return x.name === op.reward; })) return fail('Unknown reward');
        data.goal[g] = data.goal[g] === op.reward ? null : (op.reward || null);
        res.changed.goal = true; return res;
      }
      case 'cashin': {
        var item = cfg.shop.filter(function (x) { return x.name === op.reward; })[0];
        if (!item) return fail('Unknown reward');
        if (data.requests.some(function (q) { return q.g === g && q.reward === item.name && q.status === 'Waiting'; })) return fail('Already asked');
        if (C.balance(g) < item.cost) return fail('Not enough points yet');
        data.requests.push({ id: op.newId, date: today, g: g, reward: item.name, cost: item.cost, status: 'Waiting' });
        res.changed.requests = true; return res;
      }
      case 'noteSeen': {
        var n = data.notes.filter(function (x) { return x.id === op.id && x.g === g; })[0];
        if (!n) return fail('Note not found');
        n.seen = true; res.changed.notes = true; return res;
      }
      case 'check':
      case 'checkmem':
      case 'uncheck': {
        d = routineSlot(g, r, op.host, false); if (!d) return fail('Unknown routine or day');
        if (op.op === 'uncheck') { d.chk[r] = false; d.memOk[r] = false; }
        else if (op.op === 'checkmem') { if (!d.memDone[r]) return fail('Not a memory run'); d.chk[r] = true; d.memOk[r] = true; }
        else { d.chk[r] = true; d.memOk[r] = false; }
        touch(g, op.host); return res;
      }
      case 'checkall': {
        if (!validDate(op.date)) return fail('Unknown day');
        C.checkAllList(g, op.date).forEach(function (x) { var dd = C.day(g, x.host); dd.chk[x.r.k] = true; dd.memOk[x.r.k] = false; touch(g, x.host); });
        return res;
      }
      case 'nochase': {
        if (!validDate(op.date)) return fail('Unknown day');
        d = C.day(g, op.date); d.nc = !!op.on; touch(g, op.date); return res;
      }
      case 'give': {
        if (!validDate(op.date)) return fail('Unknown day');
        var why = String(op.why || '').trim().slice(0, 60);
        if (!why) return fail('Add what the point is for');
        d = C.day(g, op.date);
        if (d.behs.length >= C.R.behMax) return fail('That’s the most for the day');
        d.behs.push({ id: op.newId, for: why, by: me.name }); touch(g, op.date); return res;
      }
      case 'unbeh': {
        if (!validDate(op.date)) return fail('Unknown day');
        d = C.day(g, op.date); d.behs = d.behs.filter(function (b) { return b.id !== op.id; }); touch(g, op.date); return res;
      }
      case 'take': {
        if (op.date !== today) return fail('Points can only be taken away today');
        if (DED_REASONS.indexOf(op.why) < 0) return fail('Pick a reason');
        d = C.day(g, today);
        if (d.deds.filter(function (x) { return !x.fixed; }).length >= C.R.dedMax) return fail('That’s the most for today');
        if (today >= cfg.startDate && C.balance(g) < 1) return fail(GIRL_NAMES[g] + ' has no points to lose right now');
        d.deds.push({ id: op.newId, why: op.why, note: String(op.note || '').trim().slice(0, 80), by: me.name, fixed: false });
        touch(g, today); return res;
      }
      case 'fixded': {
        if (op.date !== today) return fail('A point can only be given back on the same day');
        d = C.day(g, today);
        var x = d.deds.filter(function (y) { return y.id === op.id; })[0];
        if (!x) return fail('Not found');
        if (!op.on) {
          if (d.deds.filter(function (y) { return !y.fixed; }).length >= C.R.dedMax) return fail('That’s the most for today');
          if (today >= cfg.startDate && C.balance(g) < 1) return fail(GIRL_NAMES[g] + ' has no points to lose right now');
        }
        x.fixed = !!op.on; touch(g, today); return res;
      }
      case 'unded': {
        if (!validDate(op.date)) return fail('Unknown day');
        d = C.day(g, op.date); d.deds = d.deds.filter(function (y) { return y.id !== op.id; }); touch(g, op.date); return res;
      }
      case 'approve':
      case 'decline': {
        var q = data.requests.filter(function (x) { return x.id === op.id && x.status === 'Waiting'; })[0];
        if (!q) return fail('Request not found');
        if (op.op === 'approve') {
          if (C.balance(q.g) < q.cost) return fail(GIRL_NAMES[q.g] + ' doesn’t have enough points yet');
          q.status = 'Approved';
          data.spending.push({ date: today, g: q.g, reward: q.reward, cost: q.cost });
          if (data.goal[q.g] === q.reward) { data.goal[q.g] = null; res.changed.goal = true; }
          res.changed.spending = true;
        } else q.status = 'Declined';
        res.changed.requests = true; return res;
      }
      case 'note': {
        var text = String(op.text || '').trim().slice(0, 140);
        if (!text) return fail('Write the note first');
        data.notes.push({ id: op.newId, date: today, g: g, text: text, from: me.name, seen: false });
        res.changed.notes = true; return res;
      }
    }
    return fail('Unknown action');
  }

  return {
    ROUTINES: ROUTINES, MEM_ROUT: MEM_ROUT, MEM_LEVELS: MEM_LEVELS, SELF_LEVELS: SELF_LEVELS, STREAK_LEVELS: STREAK_LEVELS,
    GIRLS: GIRLS, GIRL_NAMES: GIRL_NAMES, DED_REASONS: DED_REASONS,
    add: add, dow: dow, isWk: isWk, weekStart: weekStart, skipped: skipped, blankDay: blankDay, normalizeDay: normalizeDay,
    make: make, apply: apply,
    levelIn: function (n, levels) { return levels.filter(function (x) { return n >= x; }).length; }
  };
})();

</script>
<script>

  'Unpack bag and clean lunch box':'🧽',"Make tomorrow's lunch":'🥪','Change out of uniform':'👚','Exercise':'🏃','Homework':'✏️',
  'Eat dinner':'🍝','Do dinner dishes':'🧼','Shower':'🚿','Pyjamas on':'😴',
  'Clean room':'🧹','Vacuum bedroom':'💨','Washing and clothes':'🧺','Clean bathroom':'🛁','Clean kitchen':'🍳','House chore (ask a parent)':'🙋'
};

const MEM_NAMES = { before:'Morning memory', after:'After school memory', night:'Night memory' };
const CHECK = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const toD = s => new Date(s + 'T12:00:00');
const longDate = s => { const d = toD(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const shortDate = s => { const d = toD(s); return `${DAYS[d.getDay()].slice(0,3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function readLS(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }

function post(body){

    .then(r => r.json());
}

function pump(){
  if (sending || !queue.length || !DEV) return;

  const op = queue[0];
  post(Object.assign({ token: DEV.token }, op)).then(resp => {
    sending = false; net = 'ok';
    if (resp.error === 'auth') return signedOut('This device was signed out. Enter your PIN to set it up again.');
    queue.shift();
    if (!resp.data && op.op !== 'load' && /went wrong/i.test(resp.error || '') && (op.tries = (op.tries || 0) + 1) < 4) {
      queue.unshift(op); render(); clearTimeout(retryTimer); retryTimer = setTimeout(pump, 2500); return;
    }
    if (!resp.data && op.op !== 'load') refresh();
    if (resp.data) {
      P = resp;
      for (const q of queue) if (q.op !== 'load') PC.apply(P.cfg, P.data, P.today, P.me, q);
      writeLS(CACHE_KEY, P);
    }
    if (!resp.ok && resp.error) toast(resp.error);

  }).catch(() => {
    sending = false; net = 'offline'; render();
    clearTimeout(retryTimer); retryTimer = setTimeout(pump, 8000);

}
function signedOut(msg){

  if (!PC.isWk(s)) return null;

/* ---------- girl view ---------- */
function rGirl(g){
  const c = C(), s = viewDay(), bal = c.balance(g), wk = c.weekPts(g), st = c.curStreak(g), R = RULES();
  const need = R.streakDays - (st % R.streakDays);
  const note = need === 1 && !c.full(g, P.today) ? `Finish today for a +${R.streakBonus} bonus` : `${need} more full ${need===1?'day':'days'} for +${R.streakBonus}`;

      <div class="stats">

        <div class="stat"><span class="lbl">This week</span><b class="num sm">${wk}<small> / ${R.weekTarget}</small></b><div class="bar" style="--p:${Math.min(wk/R.weekTarget,1)}"><i></i></div></div>

      </div></section>
    ${rPraise(g)}
    ${rLost(g)}
    ${rWeek(g)}
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-act="tab" data-tab="today" aria-selected="${V.tab==='today'}">My day</button>

    }
    case 'goday': {
      const s = b.dataset.day; V.day = s === P.today ? null : s; V.wk = weeksBack(s); V.open = {}; render();
      const el = $app.querySelector('.girls'); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      return;
    }
    case 'blall': V.blAll = !V.blAll; return done();
    case 'tab': V.tab = b.dataset.tab; return done();
    case 'ptab': V.ptab = b.dataset.tab; return done();
    case 'hwg': V.hwg = b.dataset.to; return done();
    case 'hwwk': V.hwwk = Math.max(0, V.hwwk + Number(b.dataset.d)); return done();
    case 'open': V.open[r] = !V.open[r]; return done();
    case 'peek-ask': V.peekAsk = r; return done();
    case 'peek-no': V.peekAsk = null; return done();
    case 'signout': V.confirmDev = b.dataset.id; return done();
    case 'signout-no': V.confirmDev = null; return done();
    case 'signout-yes': V.confirmDev = null; P.devices = (P.devices || []).filter(d => d.id !== b.dataset.id); queue.push({ op:'signout', deviceId:b.dataset.id }); toast('Device signed out. It will ask for a PIN next time.'); pump(); return done();
    // girl actions
    case 'tick': {
      const on = b.getAttribute('aria-pressed') !== 'true';
      if (act({ op:'tick', r, host, i:+b.dataset.i, on })) {
        V.fx = { pop:`${r}-${b.dataset.i}` };
        const d = C().day(P.me.who, host);
        if (on && C().allDone(d, r)) { V.fx.done = r; toast(`${ROUT.find(x => x.k === r).name} done! A parent will check it.`); }
      }
      return done();
    }
    case 'start': act({ op:'start', r, host }); return done();
    case 'startmem': if (act({ op:'startmem', r, host })) toast("Memory mode on. You've got this!"); return done();
    case 'peek': V.peekAsk = null; if (act({ op:'peek', r, host })) toast('List shown. Normal points still count.'); return done();
    case 'hide': if (act({ op:'hide', r, host })) toast('List hidden. Keep going from memory!'); return done();
    case 'memdone': if (act({ op:'memdone', r, host })) { V.fx = { done:r }; toast(`🧠 ${ROUT.find(x => x.k === r).name} done from memory! A parent will confirm it.`); } return done();
    case 'practicedone': if (act({ op:'practicedone', r, host })) { V.fx = { done:r }; toast(`${ROUT.find(x => x.k === r).name} done! A parent will check it.`); } return done();
    case 'goal': act({ op:'goal', reward:b.dataset.reward }); return done();
    case 'cashin': if (act({ op:'cashin', reward:b.dataset.reward })) toast(`Asked a parent for ${b.dataset.reward}`); return done();
    case 'noteSeen': act({ op:'noteSeen', id:b.dataset.id }); return done();
    // parent actions
    case 'check': {
      const late = b.closest('.backlog');
      if (act({ op:'check', g, r, host }) && late) toast(`Checked ${girlName(g)}'s ${ROUT.find(x => x.k === r).name} for ${shortDate(host)}`);
      return late ? render() : done();
    }
    case 'checkmem': if (act({ op:'checkmem', g, r, host })) toast(`🧠 Memory run confirmed for ${girlName(g)}`); return b.closest('.backlog') ? render() : done();
    case 'uncheck': act({ op:'uncheck', g, r, host }); return done();
    case 'checkall': { const n = C().checkAllList(g, viewDay()).length; if (act({ op:'checkall', g, date:viewDay() })) toast(`Checked ${n} ${n === 1 ? 'routine' : 'routines'} for ${girlName(g)}`); return done(); }
    case 'nochase': act({ op:'nochase', g, date:viewDay(), on: b.getAttribute('aria-checked') !== 'true' }); return done();
    case 'give': {
      const why = (V.draft[g] || '').trim();
      if (!why) { toast('Add what the point is for first'); const el = document.getElementById('bf-' + g); if (el) el.focus(); return; }
      if (act({ op:'give', g, date:viewDay(), why })) { V.draft[g] = ''; toast(`+1 for ${girlName(g)}: ${why}`); }
      return done();
    }
    case 'unbeh': if (act({ op:'unbeh', g, date:viewDay(), id:b.dataset.id })) toast('Point removed'); return done();
    case 'ded-open': V.dedOpen[g] = true; render(); { const el = document.getElementById('dn-' + g); if (el && e.detail === 0) $app.querySelector(`button[data-act="take"][data-g="${g}"]`).focus(); } return;
    case 'ded-close': V.dedOpen[g] = false; V.dedNote[g] = ''; return render();
    case 'take': {
      const why = b.dataset.why;
      if (act({ op:'take', g, date:P.today, why, note:(V.dedNote[g] || '').trim() })) { V.dedOpen[g] = false; V.dedNote[g] = ''; toast(`−1 for ${girlName(g)}: ${why}`); }
      return render();
    }
    case 'fixded': { const on = b.dataset.on === '1'; if (act({ op:'fixded', g, date:P.today, id:b.dataset.id, on })) toast(on ? `Point given back to ${girlName(g)}` : 'Point taken away again'); return render(); }
    case 'unded': if (act({ op:'unded', g, date:viewDay(), id:b.dataset.id })) toast('Removed'); return render();
    case 'approve': { const q = P.data.requests.find(x => x.id === b.dataset.id); if (act({ op:'approve', id:b.dataset.id }) && q) toast(`Approved: ${q.reward} for ${girlName(q.g)}`); return done(); }
    case 'decline': if (act({ op:'decline', id:b.dataset.id })) toast('Request declined'); return done();
    case 'note': {
      const text = (V.noteDraft[g] || '').trim();
      if (!text) { toast('Write the note first'); return; }
      if (act({ op:'note', g, text })) { V.noteDraft[g] = ''; toast(`Note sent to ${girlName(g)}`); }
      return done();
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.input === 'behfor') V.draft[t.dataset.g] = t.value;
  if (t.dataset.input === 'notetext') V.noteDraft[t.dataset.g] = t.value;
  if (t.dataset.input === 'dednote') V.dedNote[t.dataset.g] = t.value;
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (!DEV && V.setup.step === 'pin' && t.tagName !== 'INPUT') {
    if (/^\d$/.test(e.key)) addDigit(e.key);
    else if (e.key === 'Backspace') { V.setup.pin = V.setup.pin.slice(0,-1); render(); }
    return;
  }
  if (e.key !== 'Enter' || !t.dataset || !t.dataset.input || t.dataset.input === 'dednote') return;
  const btn = $app.querySelector(`button[data-act="${t.dataset.input === 'behfor' ? 'give' : 'note'}"][data-g="${t.dataset.g}"]`);
  if (btn) { btn.click(); const el = document.getElementById(t.id); if (el) el.focus(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && DEV) refresh(); });
setInterval(() => { if (DEV && document.visibilityState === 'visible' && !queue.length && (DEV.who === 'parent' || Date.now() % 60000 < 30000)) refresh(); }, 30000);
setInterval(() => { if (P && !queue.length) render(); }, 5 * 60000); // keeps "Right now" in step with the clock

render();
if (DEV) refresh();

</script>
</body>
</html>
